name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt-in before June 16 2026 forced cutover

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"  # paddlepaddle only has cp313 wheels
      - name: Install backend deps
        run: uv pip install --system -e "apps/api[dev]"
      - name: Ruff check
        run: uv run ruff check apps/api packages/agents
      - name: Mypy strict check
        run: uv run mypy --strict apps/api/src packages/agents/src

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Biome lint & format check
        run: pnpm biome check .
      - name: Typecheck
        run: pnpm turbo run typecheck

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"  # paddlepaddle only has cp313 wheels
      - name: Install backend deps with test extras
        run: uv pip install --system -e "apps/api[dev]"
      - name: Run Pytest
        run: uv run pytest --cov=apps/api/src --cov-fail-under=70 apps/api/tests

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run Vitest
        run: pnpm turbo run test

  db-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase local
        run: supabase start
      - name: Verify no drift
        run: supabase db diff --schema public
