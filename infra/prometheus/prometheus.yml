global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    project: 'tradeflow-ai'

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8888']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s

  - job_name: 'celery-worker'
    static_configs:
      - targets: ['celery-worker:9100']
    scrape_interval: 30s

  - job_name: 'surya-svc'
    static_configs:
      - targets: ['surya-svc:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'paddleocr-svc'
    static_configs:
      - targets: ['paddleocr-svc:8002']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'olm-inference'
    static_configs:
      - targets: ['olm-inference:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'mineru-svc'
    static_configs:
      - targets: ['mineru-svc:8003']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
