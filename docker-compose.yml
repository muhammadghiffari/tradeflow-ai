services:
  # ─────────────────────────────────────────────
  # 1. POSTGRES — Supabase local (single service)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 2. KEYCLOAK 26 — Auth provider (sole OIDC)
  # ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # 3. REDIS 8 — Celery broker + LangGraph checkpointer
  # ─────────────────────────────────────────────
  redis:
    image: redis/redis-stack:8.0-M04
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8081:8001"    # RedisInsight UI
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 4. CHROMADB — HS Code vector store
  # ─────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.6.0
    restart: unless-stopped
    volumes:
      - chromadb-data:/chroma/chroma
    ports:
      - "8002:8000"
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: 8000
      IS_PERSISTENT: "TRUE"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 5. SURYA-SVC — Agent A (Surya 2 via vLLM)
  # GPU service — weights downloaded at startup
  # ─────────────────────────────────────────────
  surya-svc:
    build:
      context: .
      dockerfile: apps/surya-svc/Dockerfile
    restart: unless-stopped
    environment:
      HF_HUB_CACHE: /data/models
      SURYA_MODEL: datalab-to/surya-ocr
      PORT: 8001
    volumes:
      - model_cache:/data/models
    ports:
      - "8010:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─────────────────────────────────────────────
  # 6. OLM-INFERENCE — Agent D (olmOCR-2-7B-CIPL via vLLM + LoRA)
  # GPU service — base model + LoRA adapter downloaded at startup
  # ─────────────────────────────────────────────
  olm-inference:
    build:
      context: ./apps/olm-inference
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HF_HUB_CACHE: /data/models
      OLM_BASE_MODEL: ${OLM_BASE_MODEL:-allenai/olmOCR-2-7B-1025}
      OLM_LORA_ADAPTER: ${OLM_LORA_ADAPTER:-muhammadghiffari/olm-ocr-cipl-v1}
      HF_TOKEN: ${HF_TOKEN:-}
      PORT: 8000
    volumes:
      - model_cache:/data/models
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ─────────────────────────────────────────────
  # 7. PADDLEOCR-SVC — Agent B + fast path (PP-StructureV3 + PP-ChatOCRv4)
  # ─────────────────────────────────────────────
  paddleocr-svc:
    build:
      context: .
      dockerfile: apps/paddleocr-svc/Dockerfile
    restart: unless-stopped
    environment:
      HF_HUB_CACHE: /data/models
      PORT: 8002
    volumes:
      - model_cache:/data/models
    ports:
      - "8011:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # 8. MINERU-SVC — PDF preprocessing (MinerU 2.5)
  # ─────────────────────────────────────────────
  mineru-svc:
    build:
      context: .
      dockerfile: apps/mineru-svc/Dockerfile
    restart: unless-stopped
    environment:
      HF_HUB_CACHE: /data/models
      OCR_FAST_PATH_QUALITY_THRESHOLD: "0.95"
      PORT: 8003
    volumes:
      - model_cache:/data/models
    ports:
      - "8012:8003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # 9. SIMULATOR — CEISA 4.0 PIA Simulator
  # ─────────────────────────────────────────────
  simulator:
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # 10. API — FastAPI Backend
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: tradeflow
      SURYA_INFERENCE_URL: http://surya-svc:8001
      OLM_INFERENCE_URL: http://olm-inference:8000
      PADDLEOCR_SVC_URL: http://paddleocr-svc:8002
      MINERU_SVC_URL: http://mineru-svc:8003
      CEISA_BASE_URL: http://simulator:8006
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./packages/db/validation_rules.json:/app/validation_rules.json
      - ./packages/db/carrier_profiles.json:/app/carrier_profiles.json
    ports:
      - "8888:8888"

  # ─────────────────────────────────────────────
  # 11. CELERY-WORKER — Async task executor
  # ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info -Q critical,high,default,low --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: tradeflow
      SURYA_INFERENCE_URL: http://surya-svc:8001
      OLM_INFERENCE_URL: http://olm-inference:8000
      PADDLEOCR_SVC_URL: http://paddleocr-svc:8002
      MINERU_SVC_URL: http://mineru-svc:8003
      CEISA_BASE_URL: http://simulator:8006
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./packages/db/validation_rules.json:/app/validation_rules.json
      - ./packages/db/carrier_profiles.json:/app/carrier_profiles.json

  # ─────────────────────────────────────────────
  # 12. WEB — Next.js 16 Frontend
  # ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:8888
      NEXT_PUBLIC_API_URL: http://localhost:8888
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-32-chars-long-minimum!!}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-tradeflow-web}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:-change-me}
      KEYCLOAK_ISSUER: http://localhost:8080/realms/tradeflow
    volumes:
      - ./apps/web:/app/apps/web:delegated
      - web-node-modules:/app/apps/web/node_modules
    ports:
      - "3000:3000"

  # ─────────────────────────────────────────────
  # 13. PROMETHEUS — Metrics collection
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  # ─────────────────────────────────────────────
  # 14. GRAFANA — Metrics visualization
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  chromadb-data:
  model_cache:        # Shared volume for ALL model weights — mounted into all inference services
  web-node-modules:
  prometheus-data:
  grafana-data:
